global:
  scrape_interval: 30s
scrape_configs:
  - job_name: minio-job
    bearer_token: ***REMOVED***
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
    - targets: ['host.docker.internal:9000']
  - job_name: docker-daemon-job
    metrics_path: /metrics
    scheme: http
    static_configs:
    - targets: ['host.docker.internal:9323']