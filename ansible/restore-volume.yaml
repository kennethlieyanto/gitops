---
- name: Restore volumes from backup
  hosts: docker_hosts
  become: true

  vars:
    docker_services_base_path: /opt/docker-services
    backup_local_path: /tmp/docker-volume-backup

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - service_name is defined
          - volumes_to_restore | length > 0
        fail_msg: "service_name and volumes_to_restore are required"

    - name: Get backup filename
      when: backup_filename is undefined or not backup_filename
      block:
        - name: Find latest backup on remote
          ansible.builtin.shell: |
            ssh -p {{ backup_ssh_port | default(22) }} {{ backup_ssh_user }}@{{ backup_ssh_host }} \
              "ls -t {{ backup_ssh_remote_path }}{{ backup_base_filename | default(service_name + '-backup') }}*.tar.gz" | head -1
          register: remote_backup_list
          changed_when: false

        - name: Set backup filename
          ansible.builtin.set_fact:
            backup_filename: "{{ remote_backup_list.stdout_lines[0] | trim }}"

        - name: Debug backup filename
          ansible.builtin.debug:
            var: backup_filename

    - name: Display restore info
      ansible.builtin.debug:
        msg: "Restoring service '{{ service_name }}' from backup '{{ backup_filename }}'"

    - name: Create local backup directory
      ansible.builtin.file:
        path: "{{ backup_local_path }}"
        state: directory
        mode: "0755"

    - name: Download backup from SSH
      ansible.posix.synchronize:
        src: "{{ backup_filename }}"
        dest: "{{ backup_local_path }}/"
        mode: pull
        delete: no
        recursive: no
      vars:
        ssh_args: "-p {{ backup_ssh_port | default(22) }}"

    - name: Stop service containers
      community.docker.docker_compose_v2:
        project_src: "{{ docker_services_base_path }}/{{ service_name }}"
        state: absent

    - name: Remove existing volume
      community.docker.docker_volume:
        name: "{{ volume.name }}"
        state: absent
      loop: "{{ volumes_to_restore }}"
      loop_control:
        loop_var: volume

    - name: Extract backup filename
      ansible.builtin.set_fact:
        backup_basename: "{{ backup_filename.split('/') | last }}"

    - name: Restore volumes from backup
      ansible.builtin.shell: |
        docker run --rm -it \
          -v {{ volume.name }}:/backup/{{ volume.backup_path }} \
          -v {{ backup_local_path }}:/archive:ro \
          alpine sh -c "tar -xvzf /archive/{{ backup_basename }} -C /"
      loop: "{{ volumes_to_restore }}"
      loop_control:
        loop_var: volume

    - name: Start service containers
      community.docker.docker_compose_v2:
        project_src: "{{ docker_services_base_path }}/{{ service_name }}"
        state: running

    - name: Cleanup local backup
      ansible.builtin.file:
        path: "{{ backup_local_path }}"
        state: absent
