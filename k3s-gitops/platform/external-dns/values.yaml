provider:
  name: cloudflare

sources:
  - gateway-httproute

policy: sync
registry: txt
txtOwnerId: gitops

domainFilters:
  - kennethlieyanto.com

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: api-token

extraArgs:
  - --cloudflare-dns-records-per-page=5000
