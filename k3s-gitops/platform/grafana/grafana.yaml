apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    monitoring: grafana
spec:
  disableDefaultAdminSecret: false
  version: 13.2.3
  config:
    log:
      mode: console
    server:
      root_url: https://grafana.home.kennethlieyanto.com
    auth:
      disable_login_form: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak
      icon: key
      scopes: openid profile email
      auth_url: https://keycloak.home.kennethlieyanto.com/realms/kennethlieyanto/protocol/openid-connect/auth
      token_url: https://keycloak.home.kennethlieyanto.com/realms/kennethlieyanto/protocol/openid-connect/token
      api_url: https://keycloak.home.kennethlieyanto.com/realms/kennethlieyanto/protocol/openid-connect/userinfo
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "true"
      allow_sign_up: "true"
      role_attribute_path: >-
        contains(resource_access.grafana.roles[*], 'grafana-admin') && 'GrafanaAdmin'
        || contains(resource_access.grafana.roles[*], 'admin') && 'Admin'
        || contains(resource_access.grafana.roles[*], 'editor') && 'Editor'
        || contains(resource_access.grafana.roles[*], 'viewer') && 'Viewer'
      client_id: grafana
      client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    analytics:
      reporting_enabled: "false"
      check_for_plugin_updates: "false"
    plugins:
      preinstall_disabled: "true"
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  httpRoute:
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: eg
          namespace: envoy-gateway-system
      hostnames:
        - grafana.home.kennethlieyanto.com
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 10001
          containers:
            - name: grafana
              image: docker.io/grafana/grafana:13.2.3
              envFrom:
                - secretRef:
                    name: grafana-oidc
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
