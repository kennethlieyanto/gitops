apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      monitoring: grafana
  datasource:
    name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
