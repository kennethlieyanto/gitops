apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-backup-r2
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secret-manager
  target:
    name: keycloak-db-backup-r2
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: keycloak-db-backup-r2-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: keycloak-db-backup-r2-secret-access-key
