apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget-tail
  namespace: actual-budget
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - budget.tail.kennethlieyanto.com
      secretName: actual-budget-tail-tls
  rules:
    - host: budget.tail.kennethlieyanto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-budget-actualbudget
                port:
                  number: 5006
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget-home
  namespace: actual-budget
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - budget.home.kennethlieyanto.com
      secretName: actual-budget-home-tls
  rules:
    - host: budget.home.kennethlieyanto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-budget-actualbudget
                port:
                  number: 5006
