apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskchampion-sync-server
  namespace: taskwarrior
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - taskchampion.tail.kennethlieyanto.com
      secretName: taskchampion-tail-tls
  rules:
    - host: taskchampion.tail.kennethlieyanto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskchampion-sync-server
                port:
                  number: 8080
