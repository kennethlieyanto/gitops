global:
  domain: argocd.home.kennethlieyanto.com

configs:
  params:
    server.insecure: true

  cm:
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.home.kennethlieyanto.com/realms/kennethlieyanto
      clientID: argocd
      enablePKCEAuthentication: true
      refreshTokenThreshold: 2m
      requestedScopes: ["openid", "profile", "email", "offline_access"]

  rbac:
    policy.csv: |
      g, admin, role:admin
    scopes: "[argocd_roles]"

dex:
  enabled: false

server:
  httproute:
    enabled: true
    parentRefs:
      - name: eg
        namespace: envoy-gateway-system
        sectionName: https-home
    hostnames:
      - argocd.home.kennethlieyanto.com

  grpcroute:
    enabled: true
    parentRefs:
      - name: eg
        namespace: envoy-gateway-system
        sectionName: https-home
    hostnames:
      - argocd.home.kennethlieyanto.com
    rules:
      - matches:
          - headers:
              - name: content-type
                type: RegularExpression
                value: application/grpc.*
