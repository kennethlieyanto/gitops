apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.0.0
      helm:
        valueFiles:
          - $values/k3s-gitops/platform/monitoring/values.yaml
    - repoURL: git@github.com:kennethlieyanto/gitops.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:kennethlieyanto/gitops.git
      targetRevision: HEAD
      path: k3s-gitops/platform/monitoring/resources
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
