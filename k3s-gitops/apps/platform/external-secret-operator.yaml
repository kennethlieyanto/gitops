apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secret-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        valueFiles:
          - $values/k3s-gitops/platform/external-secrets/values.yaml
    - repoURL: git@github.com:kennethlieyanto/homeserver.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:kennethlieyanto/homeserver.git
      targetRevision: HEAD
      path: k3s-gitops/platform/external-secrets/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
