apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskchampion-sync-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://gothenburgbitfactory.org/taskchampion-sync-server
      chart: taskchampion-sync-server
      targetRevision: 0.2.1
      helm:
        valueFiles:
          - $values/k3s-gitops/workload/taskchamion-server/values.yaml
    - repoURL: git@github.com:kennethlieyanto/homeserver.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:kennethlieyanto/homeserver.git
      targetRevision: HEAD
      path: k3s-gitops/workload/taskchamion-server/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: taskwarrior
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
