apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        valueFiles:
          - $values/k3s-gitops/infra/metallb/values.yaml
    - repoURL: git@github.com:kennethlieyanto/homeserver.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:kennethlieyanto/kubernetes-gitops.git
      targetRevision: HEAD
      path: k3s-gitops/infra/metallb/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
